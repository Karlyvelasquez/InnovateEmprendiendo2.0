<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innovate Pitch | Evaluación de Pitch</title>
    <link rel="icon" type="image/png" href="EPM-logo-transparent.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero__brand">
          <img src="EPM-logo-transparent.png" alt="Logo EPM" class="hero__logo" />
          <h1>INNÓVATE EMPRENDIENDO - 2026</h1>
        </div>
        <div class="hero__badge" id="auth-role-badge">Sesión no iniciada</div>
      </header>

      <section id="auth-screen" class="screen active">
        <div class="auth-grid auth-grid--single">
          <div class="card card--highlight">
            <p class="section-label">Acceso</p>
            <h2>Inicia sesión para continuar</h2>
            <form id="login-form" class="login-form">
              <label>
                Usuario o correo
                <input id="login-identifier" name="identifier" type="text" placeholder="correo@epm.com.co" autocomplete="username" required />
              </label>
              <label>
                Contraseña
                <div class="password-field">
                  <input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                  <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">👁</button>
                </div>
              </label>
              <button class="button button--primary" type="submit">Entrar</button>
            </form>
            <div class="auth-note" id="login-feedback"></div>
          </div>
        </div>
      </section>

      <section id="app-screen" class="screen">
        <div class="toolbar card">
          <div>
            <p class="section-label">Sesión activa</p>
            <h2 id="user-name">-</h2>
            <p class="muted" id="user-role">-</p>
          </div>
          <div class="toolbar__actions">
            <button id="refresh-button" class="button button--ghost" type="button">Actualizar</button>
            <button id="logout-button" class="button button--secondary" type="button">Cerrar sesión</button>
          </div>
        </div>

        <main id="dashboard-root"></main>
      </section>

      <div id="team-modal" class="modal" aria-hidden="true">
        <div class="modal__backdrop" data-action="close-modal"></div>
        <div class="modal__panel card">
          <div class="modal__header">
            <div>
              <p class="section-label">Seleccionar equipo</p>
              <h3>Busca un equipo por nombre</h3>
            </div>
            <button class="button button--ghost" type="button" data-action="close-modal">Cerrar</button>
          </div>
          <input id="team-search" type="search" placeholder="Escribe para filtrar equipos..." />
          <div id="team-search-results" class="search-results"></div>
        </div>
      </div>

      <div id="toast" class="toast" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
